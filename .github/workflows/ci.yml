name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas pytest
      - name: Lint Python syntax
        run: python -m py_compile src/*.py spark/*.py notebooks/make_notebook.py
      - name: Run tests
        run: python -m pytest -q
